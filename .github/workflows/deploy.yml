name: Deploy
on:
  push:
    branches: [ "main" ]
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - run: echo "Deploying to dev..."

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod
    steps:
    - run: echo "Deploying to prod..."
